# Build-time checks for both Android flavors. Emulator and device UI tests run separately.
name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.flavor }} - build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: tv
            task: Tv
          - flavor: tablet
            task: Tablet
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          # setup-android passes a whitespace-delimited package list to sdkmanager.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK, run unit tests, and lint
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            :app:assemble${{ matrix.task }}Debug \
            :app:test${{ matrix.task }}DebugUnitTest \
            :app:lint${{ matrix.task }}Debug
      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/debug/
            app/build/reports/tests/test${{ matrix.task }}DebugUnitTest/
            app/build/test-results/test${{ matrix.task }}DebugUnitTest/
            app/build/reports/lint-results-*
