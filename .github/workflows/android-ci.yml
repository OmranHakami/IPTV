# Android TV build, JVM tests, lint and emulator-based instrumented UI tests.
name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tv - build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          # setup-android passes a whitespace-delimited package list to sdkmanager.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK, run unit tests, and lint
        run: |
          bash ./gradlew --no-daemon --stacktrace \
            :app:assembleTvDebug \
            :app:testTvDebugUnitTest \
            :app:lintTvDebug
      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/tv/debug/
            app/build/reports/tests/testTvDebugUnitTest/
            app/build/test-results/testTvDebugUnitTest/
            app/build/reports/lint-results-*

  instrumented-ui:
    name: tv - emulator UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TV search UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ./gradlew --no-daemon :app:connectedTvDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.oh.tv.ui.SearchScreenTest
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-ui-test-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
