name: L3 independent correction cycle 01
on:
  push:
    branches: ['review/rust-domain-layer']
    paths: ['.github/workflows/l3-cycle01.yml', 'review/l3-cycle01/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/review/rust-domain-layer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OLD: 23ccc9c31482b4ed1286569e7fbd82e3e0fb5e7d
      NEW: b660f685e21f014fe50d475fb6fe7d12f16d5cab
      REVIEW: 963ec44299908539b156a1ccbd7846cbf615842a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin and assemble disposable crates
        run: |
          set -euxo pipefail
          git cat-file -t "$OLD"
          git cat-file -t "$NEW"
          git cat-file -t "$REVIEW"
          git merge-base --is-ancestor "$OLD" "$NEW"
          for pair in "old:$OLD" "new:$NEW"; do
            name=${pair%%:*}; sha=${pair#*:}
            mkdir -p "$RUNNER_TEMP/$name"
            git archive "$sha" rust/domain | tar -x -C "$RUNNER_TEMP/$name"
            cd "$RUNNER_TEMP/$name/rust/domain"
            git -C "$GITHUB_WORKSPACE" show "$REVIEW:rust/domain/tests/independent_review.rs" > tests/independent_review.rs
            git -C "$GITHUB_WORKSPACE" show "$REVIEW:rust/domain/tests/extended_review.rs" > tests/extended_review.rs
            cd "$GITHUB_WORKSPACE"
          done
          cd "$RUNNER_TEMP/new/rust/domain"
          patch --fuzz=0 -p1 < verification/reviewer-fixtures.patch
          cp "$GITHUB_WORKSPACE/review/l3-cycle01/adversarial.rs" tests/cycle01.rs
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup override set 1.100.0
          rustc -vV
          cargo -V
          lscpu
          free -h
          rustfmt --edition 2021 tests/cycle01.rs
          git -C "$GITHUB_WORKSPACE" diff --exit-code "$REVIEW" HEAD -- rust/domain/src rust/domain/Cargo.toml rust/domain/Cargo.lock rust/domain/tests
      - name: Complete module graph and function inventory
        run: |
          cd "$RUNNER_TEMP/new/rust/domain"
          python3 - <<'PY'
          import pathlib,re
          paths=list(pathlib.Path('src').glob('*.rs'))
          modules={p.stem for p in paths if p.stem!='lib'}
          graph={}
          for p in paths:
              s=p.read_text()
              if p.stem=='lib': continue
              imports=set()
              for m in re.finditer(r'(?:pub\s+)?use\s+crate::(.*?);',s,re.S):
                  imports.update(re.findall(r'\b(\w+)\s*::',m.group(1)))
              imports.update(re.findall(r'crate::(\w+)::',s))
              graph[p.stem]=imports & modules
              print('MODULE',p.stem,sorted(graph[p.stem]))
              for m in re.finditer(r'\bfn\s+(\w+)\s*(?:<[^>]*>)?\s*\(',s):
                  print('FUNCTION',p.name,s.count('\n',0,m.start())+1,m.group(1))
          def visit(n,stack,done):
              assert n not in stack, ('cycle',stack,n)
              if n in done:return
              for child in graph[n]:visit(child,stack+[n],done)
              done.add(n)
          done=set()
          for n in graph:visit(n,[],done)
          print('ACYCLIC',len(done))
          PY
      - name: Original independent regression must fail on old implementation
        run: |
          cd "$RUNNER_TEMP/old/rust/domain"
          rustup override set 1.100.0
          set +e
          cargo test --locked --all-targets --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/old-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" != 0
          for test in module_graph_must_be_acyclic changed_then_restored_inputs_must_not_accept_old_match invalid_tmdb_date_must_fall_back_to_provider; do
            grep -F "test $test ... FAILED" "$RUNNER_TEMP/old-tests.log"
          done
          grep -F 'test result: FAILED. 5 passed; 2 failed;' "$RUNNER_TEMP/old-tests.log"
          grep -F 'test result: FAILED. 6 passed; 1 failed;' "$RUNNER_TEMP/old-tests.log"
      - name: Production gates at corrected commit
        if: always()
        run: |
          cd "$RUNNER_TEMP/new/rust/domain"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets --no-fail-fast -- --nocapture
          cargo test --locked --doc
          cargo tree --locked
      - name: Same runner release comparison
        if: always()
        run: |
          for iteration in 1 2 3; do
            if [ "$iteration" = 2 ]; then order="new old"; else order="old new"; fi
            for version in $order; do
              cd "$RUNNER_TEMP/$version/rust/domain"
              echo "BENCHMARK version=$version round=$iteration"
              cargo test --locked --release --test independent_review catalog_benchmark -- --ignored --nocapture --test-threads=1
              cargo test --locked --release --test extended_review metadata_and_search_comparison -- --ignored --nocapture --test-threads=1
            done
          done
      - name: Source coverage and uncovered lines
        if: always()
        run: |
          cd "$RUNNER_TEMP/new/rust/domain"
          host=$(rustc -vV | sed -n 's/^host: //p')
          llvm="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          export CARGO_TARGET_DIR="$PWD/target/coverage"
          export RUSTFLAGS="-C instrument-coverage"
          export LLVM_PROFILE_FILE="$CARGO_TARGET_DIR/%p-%m.profraw"
          mkdir -p "$CARGO_TARGET_DIR"
          cargo test --locked --all-targets --no-fail-fast
          "$llvm/llvm-profdata" merge -sparse "$CARGO_TARGET_DIR"/*.profraw -o "$CARGO_TARGET_DIR/merged.profdata"
          mapfile -t binaries < <(find "$CARGO_TARGET_DIR/debug" -type f -executable \( -name "domain-*" -o -name "independent_review-*" -o -name "extended_review-*" -o -name "cycle01-*" -o -name "oh_domain-*" \) | sort)
          args=()
          for bin in "${binaries[@]}"; do args+=(-object "$bin"); done
          "$llvm/llvm-cov" report "${args[@]}" -instr-profile="$CARGO_TARGET_DIR/merged.profdata" --ignore-filename-regex='(/rustc/|/tests/|/\.cargo/)'
          "$llvm/llvm-cov" show "${args[@]}" -instr-profile="$CARGO_TARGET_DIR/merged.profdata" "$PWD/src/metadata.rs" -show-line-counts-or-regions
      - name: Preserve source identity
        if: always()
        run: |
          cd "$RUNNER_TEMP/new/rust/domain"
          mkdir -p "$RUNNER_TEMP/pristine"
          git -C "$GITHUB_WORKSPACE" archive "$NEW" rust/domain | tar -x -C "$RUNNER_TEMP/pristine"
          diff -r src "$RUNNER_TEMP/pristine/rust/domain/src"
          cmp Cargo.toml "$RUNNER_TEMP/pristine/rust/domain/Cargo.toml"
          cmp Cargo.lock "$RUNNER_TEMP/pristine/rust/domain/Cargo.lock"
